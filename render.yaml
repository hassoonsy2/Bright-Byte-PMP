databases:
  - name: bright-byte-postgres
    databaseName: bright_byte_pmp
    user: bright_byte
    plan: basic-1gb
    region: oregon
    ipAllowList: []

services:
  - type: keyvalue
    name: bright-byte-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    runtime: docker
    name: bright-byte-api
    plan: starter
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile.api
    dockerContext: ./apps/api
    preDeployCommand: ./bin/docker-entrypoint-migrator.sh
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bright-byte-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bright-byte-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bright-byte-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LIVE_SERVER_SECRET_KEY
        generateValue: true
      - key: GUNICORN_WORKERS
        value: "2"
      - key: USE_MINIO
        value: "0"
      - key: AWS_REGION
        value: auto
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SIGNED_URL_EXPIRATION
        value: "3600"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_USE_SSL
        value: "0"
      - key: EMAIL_FROM
        value: "Bright-Byte PMP <noreply@bright-byte.example>"
      - key: WEB_URL
        value: https://bright-byte-api.onrender.com
      - key: APP_BASE_URL
        value: https://bright-byte-web.onrender.com
      - key: APP_BASE_PATH
        value: /
      - key: ADMIN_BASE_URL
        value: https://bright-byte-admin.onrender.com
      - key: ADMIN_BASE_PATH
        value: /god-mode
      - key: SPACE_BASE_URL
        value: https://bright-byte-space.onrender.com
      - key: SPACE_BASE_PATH
        value: /spaces
      - key: LIVE_BASE_URL
        value: https://bright-byte-live.onrender.com
      - key: LIVE_BASE_PATH
        value: /live
      - key: CORS_ALLOWED_ORIGINS
        value: https://bright-byte-web.onrender.com,https://bright-byte-admin.onrender.com,https://bright-byte-space.onrender.com
      - key: COOKIE_DOMAIN
        sync: false

  - type: worker
    runtime: docker
    name: bright-byte-worker
    plan: starter
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile.api
    dockerContext: ./apps/api
    dockerCommand: ./bin/docker-entrypoint-worker.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bright-byte-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bright-byte-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bright-byte-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: bright-byte-api
          envVarKey: SECRET_KEY
      - key: LIVE_SERVER_SECRET_KEY
        fromService:
          type: web
          name: bright-byte-api
          envVarKey: LIVE_SERVER_SECRET_KEY
      - key: USE_MINIO
        value: "0"
      - key: AWS_REGION
        value: auto
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SIGNED_URL_EXPIRATION
        value: "3600"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_USE_SSL
        value: "0"
      - key: EMAIL_FROM
        value: "Bright-Byte PMP <noreply@bright-byte.example>"

  - type: worker
    runtime: docker
    name: bright-byte-beat
    plan: starter
    region: oregon
    numInstances: 1
    dockerfilePath: ./apps/api/Dockerfile.api
    dockerContext: ./apps/api
    dockerCommand: ./bin/docker-entrypoint-beat.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bright-byte-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bright-byte-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: bright-byte-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: bright-byte-api
          envVarKey: SECRET_KEY
      - key: LIVE_SERVER_SECRET_KEY
        fromService:
          type: web
          name: bright-byte-api
          envVarKey: LIVE_SERVER_SECRET_KEY
      - key: USE_MINIO
        value: "0"
      - key: AWS_REGION
        value: auto
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SIGNED_URL_EXPIRATION
        value: "3600"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_USE_SSL
        value: "0"
      - key: EMAIL_FROM
        value: "Bright-Byte PMP <noreply@bright-byte.example>"

  - type: web
    runtime: docker
    name: bright-byte-live
    plan: starter
    region: oregon
    dockerfilePath: ./apps/live/Dockerfile.live
    dockerContext: .
    healthCheckPath: /live/health
    envVars:
      - key: API_BASE_URL
        value: https://bright-byte-api.onrender.com
      - key: WEB_BASE_URL
        value: https://bright-byte-web.onrender.com
      - key: LIVE_BASE_URL
        value: https://bright-byte-live.onrender.com
      - key: LIVE_BASE_PATH
        value: /live
      - key: CORS_ALLOWED_ORIGINS
        value: https://bright-byte-web.onrender.com,https://bright-byte-admin.onrender.com,https://bright-byte-space.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bright-byte-redis
          property: connectionString
      - key: LIVE_SERVER_SECRET_KEY
        fromService:
          type: web
          name: bright-byte-api
          envVarKey: LIVE_SERVER_SECRET_KEY

  - type: web
    runtime: docker
    name: bright-byte-space
    plan: starter
    region: oregon
    dockerfilePath: ./apps/space/Dockerfile.space
    dockerContext: .
    healthCheckPath: /spaces/
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bright-byte-api.onrender.com
      - key: VITE_API_BASE_PATH
        value: /api
      - key: VITE_WEB_BASE_URL
        value: https://bright-byte-web.onrender.com
      - key: VITE_WEB_BASE_PATH
        value: /
      - key: VITE_ADMIN_BASE_URL
        value: https://bright-byte-admin.onrender.com
      - key: VITE_ADMIN_BASE_PATH
        value: /god-mode
      - key: VITE_SPACE_BASE_URL
        value: https://bright-byte-space.onrender.com
      - key: VITE_SPACE_BASE_PATH
        value: /spaces
      - key: VITE_LIVE_BASE_URL
        value: https://bright-byte-live.onrender.com
      - key: VITE_LIVE_BASE_PATH
        value: /live

  - type: web
    runtime: static
    name: bright-byte-web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=web
    staticPublishPath: ./apps/web/build/client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bright-byte-api.onrender.com
      - key: VITE_API_BASE_PATH
        value: /api
      - key: VITE_WEB_BASE_URL
        value: https://bright-byte-web.onrender.com
      - key: VITE_WEB_BASE_PATH
        value: /
      - key: VITE_ADMIN_BASE_URL
        value: https://bright-byte-admin.onrender.com
      - key: VITE_ADMIN_BASE_PATH
        value: /god-mode
      - key: VITE_SPACE_BASE_URL
        value: https://bright-byte-space.onrender.com
      - key: VITE_SPACE_BASE_PATH
        value: /spaces
      - key: VITE_LIVE_BASE_URL
        value: https://bright-byte-live.onrender.com
      - key: VITE_LIVE_BASE_PATH
        value: /live

  - type: web
    runtime: static
    name: bright-byte-admin
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=admin && rm -rf render-static/admin && mkdir -p render-static/admin/god-mode && cp -R apps/admin/build/client/. render-static/admin/god-mode/
    staticPublishPath: ./render-static/admin
    routes:
      - type: redirect
        source: /
        destination: /god-mode/
      - type: rewrite
        source: /god-mode/*
        destination: /god-mode/index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bright-byte-api.onrender.com
      - key: VITE_API_BASE_PATH
        value: /api
      - key: VITE_WEB_BASE_URL
        value: https://bright-byte-web.onrender.com
      - key: VITE_WEB_BASE_PATH
        value: /
      - key: VITE_ADMIN_BASE_URL
        value: https://bright-byte-admin.onrender.com
      - key: VITE_ADMIN_BASE_PATH
        value: /god-mode
      - key: VITE_SPACE_BASE_URL
        value: https://bright-byte-space.onrender.com
      - key: VITE_SPACE_BASE_PATH
        value: /spaces
      - key: VITE_LIVE_BASE_URL
        value: https://bright-byte-live.onrender.com
      - key: VITE_LIVE_BASE_PATH
        value: /live
